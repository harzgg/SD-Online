<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="COMICS PLUS!  Comics, Video Games, Vintage Toys, and More">
  <defs>
    <radialGradient id="burst" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#5ec8ff"/>
      <stop offset="42%" stop-color="#1e7fe0"/>
      <stop offset="100%" stop-color="#0a3d9e"/>
    </radialGradient>
    <pattern id="halftone" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2.2" cy="2.2" r="1.7" fill="#041a4a" opacity="0.28"/>
    </pattern>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" fill="url(#burst)"/>
  <!-- Sunburst rays -->
  <g opacity="0.35" fill="#9ad8ff">
    <polygon points="600,260 1200,0 1200,40"/>
    <polygon points="600,260 1200,80 1200,120"/>
    <polygon points="600,260 1200,160 1200,200"/>
    <polygon points="600,260 1200,240 1200,280"/>
    <polygon points="600,260 1200,320 1200,360"/>
    <polygon points="600,260 1200,400 1200,440"/>
    <polygon points="600,260 1200,480 1200,520"/>
    <polygon points="600,260 0,0 0,40"/>
    <polygon points="600,260 0,80 0,120"/>
    <polygon points="600,260 0,160 0,200"/>
    <polygon points="600,260 0,240 0,280"/>
    <polygon points="600,260 0,320 0,360"/>
    <polygon points="600,260 0,400 0,440"/>
    <polygon points="600,260 0,480 0,520"/>
  </g>
  <rect width="1200" height="520" fill="url(#halftone)"/>

  <!-- Red speed lines -->
  <g stroke="#e31b23" stroke-width="5" stroke-linecap="round" opacity="0.95">
    <line x1="310" y1="300" x2="780" y2="255"/>
    <line x1="330" y1="318" x2="800" y2="278"/>
    <line x1="350" y1="336" x2="820" y2="300"/>
    <line x1="370" y1="354" x2="790" y2="325"/>
  </g>

  <!-- COMICS wordmark -->
  <g transform="translate(600 215) skewX(-8)" filter="url(#soft)">
    <text text-anchor="middle" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif"
          font-size="168" font-style="italic" font-weight="900"
          fill="#0a0a08" stroke="#0a0a08" stroke-width="28" stroke-linejoin="round">COMICS</text>
    <text text-anchor="middle" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif"
          font-size="168" font-style="italic" font-weight="900"
          fill="none" stroke="#c8c8c8" stroke-width="10" stroke-linejoin="round">COMICS</text>
    <text text-anchor="middle" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif"
          font-size="168" font-style="italic" font-weight="900"
          fill="#ffffff">COMICS</text>
  </g>

  <!-- PLUS! -->
  <g transform="translate(820 355) skewX(-8)" filter="url(#soft)">
    <text text-anchor="middle" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif"
          font-size="92" font-style="italic" font-weight="900"
          fill="#0a0a08" stroke="#0a0a08" stroke-width="20" stroke-linejoin="round">PLUS!</text>
    <text text-anchor="middle" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif"
          font-size="92" font-style="italic" font-weight="900"
          fill="none" stroke="#c8c8c8" stroke-width="7" stroke-linejoin="round">PLUS!</text>
    <text text-anchor="middle" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif"
          font-size="92" font-style="italic" font-weight="900"
          fill="#ffffff">PLUS!</text>
  </g>

  <!-- Tagline bar -->
  <rect x="90" y="430" width="1020" height="54" rx="14" fill="#0a0a08"/>
  <text x="600" y="466" text-anchor="middle"
        font-family="'Arial Black', Arial, sans-serif" font-size="24" font-weight="700"
        letter-spacing="3" fill="#ffffff">COMICS " VIDEO GAMES " VINTAGE TOYS " AND MORE</text>
</svg>
