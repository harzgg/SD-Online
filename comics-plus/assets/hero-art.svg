<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a18"/>
      <stop offset="55%" stop-color="#0a0a08"/>
      <stop offset="100%" stop-color="#2a2400"/>
    </linearGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffe600" opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <!-- comic panels -->
  <g stroke="#ffe600" stroke-width="8" fill="#3a3a36">
    <rect x="820" y="80" width="340" height="280"/>
    <rect x="1180" y="80" width="340" height="280"/>
    <rect x="820" y="390" width="700" height="420"/>
  </g>
  <g fill="#ffe600">
    <polygon points="860,300 980,160 1040,220 1120,120 1140,300"/>
    <circle cx="1350" cy="200" r="70"/>
    <rect x="880" y="470" width="180" height="40"/>
    <rect x="880" y="530" width="280" height="24" fill="#ffffff"/>
    <rect x="880" y="580" width="220" height="24" fill="#b8b8b0"/>
  </g>
  <text x="900" y="760" font-family="Impact, Arial Black, sans-serif" font-size="72" fill="#ffe600">PLUS!</text>
  <text x="900" y="820" font-family="Arial, sans-serif" font-size="28" fill="#e8e8e4">COMICS · GAMES · GEAR</text>
</svg>
